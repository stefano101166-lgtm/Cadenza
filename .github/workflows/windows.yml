name: Cadenza Windows Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE 8.0.13
        run: git clone --depth 1 --branch 8.0.13 https://github.com/juce-framework/JUCE.git lib/JUCE

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S . -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-msvc

      - name: Test
        run: ctest --test-dir build-msvc --output-on-failure

      - name: Upload Cadenza Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadenza-Windows
          path: build-msvc/Cadenza_artefacts/Release/
          if-no-files-found: error
